name: maps
description: "A high-performance modern map and navigation mobile application built with Flutter."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_map: ^8.3.2
  flutter_map_cache: ^2.1.0
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  http: ^1.6.0
  http_cache_file_store: ^2.0.2
  dio: ^5.11.1
  dio_cache_interceptor: ^4.0.7
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true